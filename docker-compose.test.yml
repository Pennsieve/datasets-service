version: '3'

networks:
  api-tests:
    driver: bridge

services:
  local_tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - dockertest.env
    depends_on:
      - pennsievedb-ci
      - minio-ci
    environment:
      - POSTGRES_HOST=pennsievedb-ci
      - MINIO_URL=http://minio-ci:9000
      - MANIFEST_FILES_BUCKET=test-manifest-bucket
      - CREATE_MANIFEST_SNS_TOPIC=create-manifest-topic
    volumes:
      - $PWD:/go/src/github.com/pennsieve/datasets-service
    networks:
      - api-tests



  # Test Container for Jenkins
  ci-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - dockertest.env
    depends_on:
      - pennsievedb-ci
      - minio-ci
    environment:
      - POSTGRES_HOST=pennsievedb-ci
      - MINIO_URL=http://minio-ci:9000
      - MANIFEST_FILES_BUCKET=test-manifest-bucket
      - CREATE_MANIFEST_SNS_TOPIC=create-manifest-topic
    volumes:
      - $PWD:/go/src/github.com/pennsieve/datasets-service
    networks:
      - api-tests

  pennsievedb:
    image: pennsieve/pennsievedb:V20221102133799-seed
    restart: always
    ports:
      - "5432:5432"
    networks:
      - api-tests

  pennsievedb-ci:
    image: pennsieve/pennsievedb:V20221102133799-seed
    restart: always
    networks:
      - api-tests

  minio-ci:
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    networks:
      - api-tests
